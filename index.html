<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Flux — bassin circulaire</title>

  <style>
    /* Présentation : aucune influence sur le calcul du fluide. */
    body {
      background: #101d2c;
      color: #e5eff8;
      font: 15px system-ui, sans-serif;
      margin: 0;
      padding: 20px;
    }
    main { max-width: 550px; margin: auto; }
    button {
      padding: 10px 15px;
      border: 1px solid #728aa1;
      border-radius: 8px;
      background: #233d55;
      color: white;
      cursor: pointer;
    }
    button:first-child { background: #225eae; }
    label { display: block; margin: 15px 0; }
    input { width: 100%; }
    canvas {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 8px;
      background: #081827;
    }
    #info {
      display: flex;
      justify-content: space-between;
      color: #b6c6d5;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main>
    <h2>Flux — bassin circulaire</h2>
    <p>Prototype numérique 2D, non conservatif : les trajectoires ne sont pas une solution exacte des équations d’Euler.</p>

    <!-- Commandes de la simulation -->
    <div>
      <button id="start">Déclencher</button>
      <button id="pause">Pause</button>
      <button id="reset">Effacer</button>
    </div>

    <label>
      Vitesse du jet : <b id="vl">0,5 m/s</b>
      <input id="v" type="range" min=".1" max="1.5" step=".1" value=".5">
    </label>
    <label>
      Angle du jet : <b id="al">0°</b>
      <input id="angle" type="range" min="-90" max="90" step="5" value="0">
    </label>
    <label>
      Épaisseur du premier tuyau : <b id="width1l">3,5 %</b>
      <input id="width1" type="range" min="0" max="7" step=".5" value="3.5">
    </label>
    <label>
      Durée du jet : <b id="dl">2,0 s</b>
      <input id="d" type="range" min=".5" max="6" step=".5" value="2">
    </label>
    <fieldset style="border:1px solid #52758c;border-radius:8px;margin:18px 0;padding:12px">
      <legend>Deuxième jet (cyan)</legend>
      <label><input id="enable2" type="checkbox" checked style="width:auto"> Activer le deuxième jet</label>
      <label>Position sur le cercle : <b id="pos2l">180°</b>
        <input id="pos2" type="range" min="0" max="360" step="5" value="180">
      </label>
      <label>Angle relatif vers le centre : <b id="angle2l">0°</b>
        <input id="angle2" type="range" min="-90" max="90" step="5" value="0">
      </label>
      <label>Épaisseur du deuxième tuyau : <b id="width2l">3,5 %</b>
        <input id="width2" type="range" min="0" max="7" step=".5" value="3.5">
      </label>
      <label>Vitesse du deuxième jet : <b id="v2l">0,5 m/s</b>
        <input id="v2" type="range" min=".1" max="1.5" step=".1" value=".5">
      </label>
      <label>Durée du deuxième jet : <b id="d2l">2,0 s</b>
        <input id="d2" type="range" min=".5" max="6" step=".5" value="2">
      </label>
    </fieldset>
    <label>
      Persistance des trajectoires : <b id="pl">5 s</b>
      <input id="persist" type="range" min="1" max="31" step="1" value="5">
    </label>

    <!-- Surface de dessin : 480 × 480 pixels -->
    <canvas id="view" width="480" height="480"></canvas>
    <div id="info">
      <span id="clock">Temps : 0,00 s</span>
      <span id="count">0 particule</span>
    </div>
    <p id="status">Fluide au repos.</p>
  </main>

  <script>
    'use strict';

    // ============================================================
    // 1. ACCÈS À LA PAGE ET CONSTANTES NUMÉRIQUES
    // ============================================================

    // Raccourci pour retrouver un élément HTML par son identifiant.
    const $ = id => document.getElementById(id);
    const c = $('view');              // Surface de dessin.
    const g = c.getContext('2d');     // Outils graphiques 2D.

    const N = 48;                     // 48 cellules par côté.
    const L = N * N;                  // 2 304 cellules au total.
    const h = 1 / N;                  // Taille d'une cellule (coordonnées normalisées).
    const dt = .012;                  // Pas de temps simulé : 0,012 seconde.

    // Conversion des indices de grille (i, j) en indice de tableau.
    const idx = (i, j) => i + j * N;

    // Maintient une valeur x entre les bornes a et b.
    const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

    // Champs de vitesse : u horizontal, v vertical.
    // un et vn reçoivent les valeurs calculées à l'étape suivante.
    const u = new Float64Array(L);
    const v = new Float64Array(L);
    const un = new Float64Array(L);
    const vn = new Float64Array(L);

    // Pression numérique, copie de travail et divergence.
    const p = new Float64Array(L);
    const pn = new Float64Array(L);
    const div = new Float64Array(L);

    // mask vaut 1 dans le bassin et 0 à l'extérieur.
    const mask = new Uint8Array(L);

    // ============================================================
    // 2. ÉTAT DE LA SIMULATION
    // ============================================================

    let particles = [];  // Positions actuelles des particules visibles.
    let segments = [];   // Segments des trajectoires, avec leur date.
    let t = 0;           // Temps simulé.
    let running = false;
    let paused = false;
    let last = null;     // Date de la dernière image en mode actif.
    let acc = 0;         // Temps réel accumulé pour les pas de calcul.
    let spawn = 0;
    let spawn2 = 0;       // Fraction de particule restant à injecter.
    let seed = 19;       // Graine du générateur pseudo-aléatoire.

    // Générateur déterministe : mêmes conditions, même semis initial.
    const rnd = () => {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      return seed / 4294967296;
    };

    // ============================================================
    // 3. GÉOMÉTRIE DU BASSIN CIRCULAIRE
    // ============================================================

    for (let j = 0; j < N; j++) {
      for (let i = 0; i < N; i++) {
        let x = (i + .5) / N - .5;
        let y = (j + .5) / N - .5;
        mask[idx(i, j)] = x * x + y * y < .475 ** 2 ? 1 : 0;
      }
    }

    // Test géométrique sur les positions continues des particules.
    function inside(x, y) {
      return (x - .5) ** 2 + (y - .5) ** 2 < .475 ** 2;
    }

    // Interpolation bilinéaire du champ a à la position (x, y).
    // Seules les cellules appartenant au bassin contribuent.
    function sample(a, x, y) {
      let xx = clamp(x * N - .5, 0, N - 1.001);
      let yy = clamp(y * N - .5, 0, N - 1.001);
      let i = Math.floor(xx);
      let j = Math.floor(yy);
      let fx = xx - i;
      let fy = yy - j;
      let s = 0;   // Somme pondérée des valeurs.
      let w = 0;   // Somme des poids admissibles.

      for (let dj = 0; dj <= 1; dj++) {
        for (let di = 0; di <= 1; di++) {
          let k = idx(i + di, j + dj);
          let w0 = (di ? fx : 1 - fx) * (dj ? fy : 1 - fy);
          if (mask[k]) {
            s += w0 * a[k];
            w += w0;
          }
        }
      }
      return w ? s / w : 0;
    }

    // Deuxième buse : 0° à gauche, 90° en haut, 180° à droite.
    // L'angle relatif nul dirige le jet vers le centre.
    function nozzle2() {
      const phi = +$('pos2').value * Math.PI / 180;
      const theta = ( +$('pos2').value + +$('angle2').value ) * Math.PI / 180;
      return {
        x: .5 - .433 * Math.cos(phi),
        y: .5 - .433 * Math.sin(phi),
        dx: Math.cos(theta),
        dy: -Math.sin(theta)
      };
    }

    // ============================================================
    // 4. UN PAS DE SIMULATION DU FLUIDE
    // ============================================================

    function solve() {
      const speed = +$('v').value;  // Vitesse choisie sur le curseur.
      const T = +$('d').value;      // Durée d'injection choisie.
      const angle = +$('angle').value * Math.PI / 180;
      const jetX = speed * Math.cos(angle);
      const jetY = -speed * Math.sin(angle); // Axe vertical de l'écran orienté vers le bas.

      // 4.1 Advection semi-lagrangienne :
      // recherche en arrière la vitesse transportée vers chaque cellule.
      for (let j = 1; j < N - 1; j++) {
        for (let i = 1; i < N - 1; i++) {
          let k = idx(i, j);
          if (!mask[k]) continue;

          let x = (i + .5) / N;
          let y = (j + .5) / N;
          un[k] = sample(u, x - u[k] * dt, y - v[k] * dt);
          vn[k] = sample(v, x - u[k] * dt, y - v[k] * dt);
        }
      }
      u.set(un);
      v.set(vn);

      // 4.2 Jet orientable imposé près du bord gauche.
      if (t < T) {
        for (let j = 1; j < N - 1; j++) {
          for (let i = 1; i < N - 1; i++) {
            let k = idx(i, j);
            if (mask[k] && (i + .5) / N < .095 &&
                Math.abs((j + .5) / N - .5) < .026) {
              u[k] = jetX;
              v[k] = jetY;
            }
          }
        }
      }

      // Deuxième jet : petite zone d'injection à proximité de sa buse.
      if ($('enable2').checked && t < +$('d2').value) {
        const b = nozzle2();
        const speed2 = +$('v2').value;
        for (let j = 1; j < N - 1; j++) {
          for (let i = 1; i < N - 1; i++) {
            const k = idx(i, j);
            const dx = (i + .5) / N - b.x;
            const dy = (j + .5) / N - b.y;
            if (mask[k] && dx * dx + dy * dy < .034 ** 2) {
              u[k] = speed2 * b.dx;
              v[k] = speed2 * b.dy;
            }
          }
        }
      }

      // 4.3 Divergence discrète : mesure de la compression locale
      // du champ numérique (elle devrait être nulle idéalement).
      for (let j = 1; j < N - 1; j++) {
        for (let i = 1; i < N - 1; i++) {
          let k = idx(i, j);
          if (!mask[k]) continue;

          let R = mask[k + 1] ? u[k + 1] : -u[k];
          let A = mask[k - 1] ? u[k - 1] : -u[k];
          let B = mask[k + N] ? v[k + N] : -v[k];
          let D = mask[k - N] ? v[k - N] : -v[k];
          div[k] = (R - A + B - D) * .5 / h;
        }
      }

      // 4.4 Pression numérique : 65 itérations de Jacobi
      // pour approximer la solution de l'équation de Poisson.
      p.fill(0);
      for (let z = 0; z < 65; z++) {
        for (let j = 1; j < N - 1; j++) {
          for (let i = 1; i < N - 1; i++) {
            let k = idx(i, j);
            if (!mask[k]) continue;

            let sum = 0;
            let n = 0;
            for (const q of [k - 1, k + 1, k - N, k + N]) {
              if (mask[q]) {
                sum += p[q];
                n++;
              }
            }
            pn[k] = n ? (sum - div[k] * h * h / dt) / n : 0;
          }
        }
        p.set(pn);
      }

      // 4.5 Projection : retrait du gradient de pression,
      // puis limitation des vitesses dirigées vers les parois.
      for (let j = 1; j < N - 1; j++) {
        for (let i = 1; i < N - 1; i++) {
          let k = idx(i, j);
          if (!mask[k]) continue;

          let px = (mask[k + 1] ? p[k + 1] : p[k])
                 - (mask[k - 1] ? p[k - 1] : p[k]);
          let py = (mask[k + N] ? p[k + N] : p[k])
                 - (mask[k - N] ? p[k - N] : p[k]);

          u[k] -= dt * px / (2 * h);
          v[k] -= dt * py / (2 * h);

          if (!mask[k - 1] && u[k] < 0) u[k] = 0;
          if (!mask[k + 1] && u[k] > 0) u[k] = 0;
          if (!mask[k - N] && v[k] < 0) v[k] = 0;
          if (!mask[k + N] && v[k] > 0) v[k] = 0;
        }
      }

      // 4.6 Émission à intervalles temporels réguliers (temps simulé).
      // L'instant exact de naissance est conservé à l'intérieur du pas dt.
      // Un changement de débit conserve la fraction du cycle déjà écoulée.
      function emit(rate, duration, phase, create) {
        const interval = 1 / rate;
        let elapsed = (1 - phase) * interval;
        while (elapsed <= duration + 1e-12) {
          create(dt - elapsed);
          elapsed += interval;
        }
        return (phase + rate * duration) % 1;
      }

      if (t < T) {
        const duration = Math.min(dt, T - t);
        spawn = emit(Math.max(8, 90 * speed), duration, spawn, age => {
          particles.push({ x: .067, y: .5 + (rnd() - .5) * (+$('width1').value / 100), jet: 1, age });
        });
      }

      if ($('enable2').checked && t < +$('d2').value) {
        const b = nozzle2();
        const duration = Math.min(dt, +$('d2').value - t);
        spawn2 = emit(Math.max(8, 90 * +$('v2').value), duration, spawn2, age => {
          const offset = (rnd() - .5) * (+$('width2').value / 100);
          particles.push({
            x: b.x - b.dy * offset,
            y: b.y + b.dx * offset,
            jet: 2,
            age
          });
        });
      }

      // 4.7 Transport : une particule nouvellement créée ne parcourt
      // que la fraction de dt postérieure à son instant de naissance.
      const batch = [];
      const batch2 = [];
      for (const a of particles) {
        const travel = a.age === undefined ? dt : a.age;
        delete a.age;
        if (travel <= 0) continue;
        let ox = a.x;
        let oy = a.y;
        let vx = sample(u, ox, oy);
        let vy = sample(v, ox, oy);
        let mx = ox + vx * travel * .5;
        let my = oy + vy * travel * .5;
        let nx = ox + sample(u, mx, my) * travel;
        let ny = oy + sample(v, mx, my) * travel;

        if (inside(nx, ny)) {
          a.x = nx;
          a.y = ny;
          if (Math.hypot(nx - ox, ny - oy) > 1e-8) {
            (a.jet === 2 ? batch2 : batch).push(ox * 480, oy * 480, nx * 480, ny * 480);
          }
        }
      }

      // 4.8 Enregistrement des nouveaux segments et expiration
      // des segments anciens. La valeur 31 signifie « permanent ».
      t += dt;
      if (batch.length) segments.push({ t, data: batch, jet: 1 });
      if (batch2.length) segments.push({ t, data: batch2, jet: 2 });

      let persistence = +$('persist').value;
      if (persistence !== 31) {
        while (segments.length && segments[0].t <= t - persistence) {
          segments.shift();
        }
      }
    }

    // ============================================================
    // 5. DESSIN : BASSIN, TRAJECTOIRES ET PARTICULES
    // ============================================================

    function draw() {
      // Effacement de l'image précédente.
      g.fillStyle = '#081827';
      g.fillRect(0, 0, 480, 480);

      // Disque du bassin et contour.
      g.beginPath();
      g.arc(240, 240, 228, 0, Math.PI * 2);
      g.fillStyle = '#0d2940';
      g.fill();
      g.strokeStyle = '#8cabbf';
      g.lineWidth = 2;
      g.stroke();

      // Le découpage empêche les traces de dépasser du bassin.
      g.save();
      g.beginPath();
      g.arc(240, 240, 227, 0, Math.PI * 2);
      g.clip();

      // Traces lumineuses : chaque groupe contient des segments
      // sous la forme [x1, y1, x2, y2, ...].
      g.lineWidth = .8;
      for (const batch of segments) {
        g.strokeStyle = batch.jet === 2 ? 'rgba(115,255,205,.58)' : 'rgba(104,203,242,.53)';
        g.beginPath();
        const a = batch.data;
        for (let i = 0; i < a.length; i += 4) {
          g.moveTo(a[i], a[i + 1]);
          g.lineTo(a[i + 2], a[i + 3]);
        }
        g.stroke();
      }

      // Petits points orange : positions actuelles des particules.
      for (const a of particles) {
        g.fillStyle = a.jet === 2 ? '#80ffd4' : '#ffbd6a';
        g.beginPath();
        g.arc(a.x * 480, a.y * 480, 2, 0, Math.PI * 2);
        g.fill();
      }
      g.restore();

      // Repère orange de la buse d'injection.
      g.fillStyle = '#ff9c45';
      g.beginPath();
      g.arc(27, 240, 5, 0, Math.PI * 2);
      g.fill();
      // Flèche indiquant la direction choisie du jet.
      const theta = +$('angle').value * Math.PI / 180;
      const ax = 27 + 24 * Math.cos(theta);
      const ay = 240 - 24 * Math.sin(theta);
      g.strokeStyle = '#ff9c45';
      g.lineWidth = 2;
      g.beginPath();
      g.moveTo(27, 240);
      g.lineTo(ax, ay);
      g.moveTo(ax, ay);
      g.lineTo(ax - 7 * Math.cos(theta - .5), ay + 7 * Math.sin(theta - .5));
      g.moveTo(ax, ay);
      g.lineTo(ax - 7 * Math.cos(theta + .5), ay + 7 * Math.sin(theta + .5));
      g.stroke();

      // Deuxième buse et flèche d'orientation.
      if ($('enable2').checked) {
        const b = nozzle2();
        const bx = b.x * 480, by = b.y * 480;
        g.fillStyle = '#80ffd4';
        g.beginPath();
        g.arc(bx, by, 5, 0, Math.PI * 2);
        g.fill();
        const ex = bx + 24 * b.dx, ey = by + 24 * b.dy;
        const a = Math.atan2(b.dy, b.dx);
        g.strokeStyle = '#80ffd4';
        g.lineWidth = 2;
        g.beginPath();
        g.moveTo(bx, by);
        g.lineTo(ex, ey);
        g.moveTo(ex, ey);
        g.lineTo(ex - 7 * Math.cos(a - .5), ey - 7 * Math.sin(a - .5));
        g.moveTo(ex, ey);
        g.lineTo(ex - 7 * Math.cos(a + .5), ey - 7 * Math.sin(a + .5));
        g.stroke();
      }

      // Indications textuelles sous le bassin.
      $('clock').textContent = 'Temps : ' + t.toFixed(2).replace('.', ',') + ' s';
      $('count').textContent = particles.length + ' particules';
      $('status').textContent = !running
        ? 'Fluide au repos.'
        : t < +$('d').value || ($('enable2').checked && t < +$('d2').value)
          ? 'Injection en cours'
          : 'Jet arrêté — trajectoires résiduelles';
    }

    // ============================================================
    // 6. HORLOGE D'ANIMATION
    // ============================================================

    let frameId = null;

    // Regroupe les demandes reçues avant le prochain rafraîchissement.
    function requestDraw() {
      if (frameId === null) frameId = requestAnimationFrame(frame);
    }

    function frame(now) {
      frameId = null;

      if (running && !paused) {
        // La première image après démarrage ou reprise ne fait pas avancer le fluide.
        const elapsed = last === null ? 0 : Math.min(.06, (now - last) / 1000);
        last = now;
        acc += elapsed;
        let n = 0;
        while (acc >= dt && n < 5) {
          solve();
          acc -= dt;
          n++;
        }
      }

      draw();
      if (running && !paused) requestDraw();
    }

    // ============================================================
    // 7. REMISE À ZÉRO ET COMMANDES
    // ============================================================

    function reset() {
      u.fill(0);
      v.fill(0);
      un.fill(0);
      vn.fill(0);
      p.fill(0);
      pn.fill(0);
      particles = [];
      segments = [];
      t = 0;
      last = null;
      acc = 0;
      spawn = 0;
      spawn2 = 0;
      running = false;
      paused = false;
      seed = 19;
      $('pause').textContent = 'Pause';
    }

    $('start').onclick = () => {
      reset();
      running = true;
      requestDraw();
    };
    $('reset').onclick = () => {
      reset();
      requestDraw();
    };
    $('pause').onclick = () => {
      paused = !paused;
      last = null;
      $('pause').textContent = paused ? 'Reprendre' : 'Pause';
      requestDraw();
    };

    // Mise à jour des valeurs affichées quand on déplace les curseurs.
    for (const [id, out, suffix] of [
      ['v', 'vl', ' m/s'],
      ['d', 'dl', ' s'],
      ['v2', 'v2l', ' m/s'],
      ['d2', 'd2l', ' s']
    ]) {
      $(id).oninput = () => {
        $(out).textContent =
          (+$(id).value).toFixed(1).replace('.', ',') + suffix;
        if (id === 'd' || id === 'd2') requestDraw();
      };
    }

    $('angle').oninput = () => {
      $('al').textContent = $('angle').value + '°';
      requestDraw();
    };

    for (const [id, out] of [['pos2', 'pos2l'], ['angle2', 'angle2l']]) {
      $(id).oninput = () => {
        $(out).textContent = $(id).value + '°';
        requestDraw();
      };
    }

    for (const [id, out] of [['width1', 'width1l'], ['width2', 'width2l']]) {
      $(id).oninput = () => {
        $(out).textContent = (+$(id).value).toFixed(1).replace('.', ',') + ' %';
        requestDraw();
      };
    }

    $('enable2').onchange = requestDraw;

    $('persist').oninput = () => {
      let q = +$('persist').value;
      $('pl').textContent = q === 31 ? '∞ (permanente)' : q + ' s';
    };

    // Affiche le bassin au repos une seule fois.
    requestDraw();
  </script>
</body>
</html>
